<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>오프라인 · CRUSTORY</title>
    <style>
      :root {
        --ink: #1e1b17;
        --paper: #f3f0e8;
        --muted: #6b6560;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(circle at top, #fff8ee, var(--paper) 55%);
        color: var(--ink);
        font-family: "Pretendard", system-ui, sans-serif;
      }
      main {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.75rem;
        letter-spacing: 0.04em;
      }
      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
        line-height: 1.5;
      }
      button {
        appearance: none;
        border: 0;
        background: var(--ink);
        color: #fff;
        padding: 0.85rem 1.4rem;
        border-radius: 999px;
        font-size: 0.95rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>연결이 끊겼어요</h1>
        <p>
          네트워크를 확인한 뒤 다시 시도해 주세요.<br />
          러니도 당근을 찾느라 잠시 쉬고 있어요.
        </p>
        <button type="button" id="retry">다시 시도</button>
      </div>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", function () {
        window.location.href = "https://crustory.vercel.app/?app=1";
      });
    </script>
  </body>
</html>
